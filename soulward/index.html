/* Layout: one screen at a time. Play is a single grid (status / stage / entry / tools / keys); the stage holds the falling words above the ward,
   the stone wall at the bottom that carries every piece of state: embers = hearts, dots = streak, stones = shields.
   Single committed dark look (a candle-lit crypt), so no light theme. */
:root{
  color-scheme:dark;
  --abyss:#0d0b10; --crypt:#17131c; --stone:#241d2b; --stone-hi:#352b3f; --rule:#3d3247;
  --ink:#efe6dc; --dim:#a99db0; --faint:#6f6478;
  --ember:#e8a54b; --ember-hi:#f6cf8e; --ember-lo:#a8641f;
  --soul:#8cc8ff; --ok:#6fdc8c; --bad:#ff5f5f;
  --display:'Cinzel','Trajan Pro',Georgia,serif;
  --body:'Spectral',Georgia,'Times New Roman',serif;
  --key-h:44px; --stone-h:24px; --ward-h:40px; --word-size:20px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--soul);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* the ward rune motif: a diamond with a tick either side */
.rune{display:inline-block;width:10px;height:10px;transform:rotate(45deg);border:1.5px solid currentColor;flex:none}
.rune.fill{background:currentColor}
.divider{display:flex;align-items:center;gap:10px;color:var(--ember-lo);width:100%;max-width:280px;margin-inline:auto}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:currentColor;opacity:.7}
.bg-runes{background-color:var(--abyss);
  background-image:
    linear-gradient(45deg,transparent 46%,rgba(232,165,75,.05) 46% 54%,transparent 54%),
    linear-gradient(-45deg,transparent 46%,rgba(232,165,75,.05) 46% 54%,transparent 54%),
    radial-gradient(ellipse at 50% 110%,rgba(232,165,75,.14),transparent 60%);
  background-size:44px 44px,44px 44px,100% 100%}

#app{height:100%;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{width:100%;max-width:560px;margin:0 auto;padding-inline:20px;padding-block:24px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:.06em}
h2{font-size:22px;font-weight:600}
h3{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
p{margin:0}
.muted{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.btn{min-height:48px;padding:10px 18px;border-radius:10px;border:1px solid var(--rule);background:var(--crypt);color:var(--ink);
  font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.08em;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .08s,background .15s,border-color .15s}
.btn:active,.btn.down{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,var(--ember-hi),var(--ember) 55%,var(--ember-lo));color:#2a1606;border-color:var(--ember-hi);font-weight:800;font-size:18px}
.btn.wide{width:100%}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.armed{background:var(--bad);color:#200;border-color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:default}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--crypt);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;color:var(--ember-hi);flex:none}
.back{align-self:flex-start}
.icon-sm{font-family:var(--display);font-weight:800;color:var(--ember-hi);font-size:16px}
.bars{display:flex;gap:4px}.bars i{width:4px;height:14px;border-radius:1px;background:var(--ember-hi)}

/* switches */
.set-list{display:flex;flex-direction:column;border-top:1px solid var(--rule)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 2px;border-bottom:1px solid var(--rule);min-height:56px}
.set-row .lbl{display:flex;flex-direction:column;min-width:0}
.set-row .lbl small{color:var(--dim);font-size:13px;line-height:1.3}
.switch{width:52px;height:30px;border-radius:15px;border:1px solid var(--rule);background:var(--stone);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
.switch[aria-checked="true"]{background:var(--ember-lo);border-color:var(--ember)}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:var(--ember-hi)}
.seg{display:flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;flex:none;max-width:100%}
.set-row{flex-wrap:wrap}
.set-row .lbl{flex:1 1 180px}
.seg button{padding-inline:10px}
.seg button{min-width:52px;min-height:40px;border:0;background:var(--stone);font-family:var(--display);font-weight:600;letter-spacing:.06em}
.seg button[aria-pressed="true"]{background:var(--ember);color:#2a1606}
.saved{font-size:13px;color:var(--ok);opacity:0;transition:opacity .2s;min-height:1.3em}
.saved.on{opacity:1}

/* home */
#home .page{min-height:100%;align-items:stretch}
#home .page>:first-child{margin-top:auto}#home .page>:last-child{margin-bottom:auto}
.event-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;border:1px solid var(--rule);border-radius:12px;background:rgba(23,19,28,.8)}
.event-row .lbl{display:flex;flex-direction:column}
.event-note{font-size:13px;color:var(--ember-hi)}
.logo{position:relative;width:150px;height:132px;margin:6px auto 0;flex:none}
.logo .arch{position:absolute;left:15px;right:15px;bottom:0;height:70px;border-radius:60px 60px 6px 6px;background:
  repeating-linear-gradient(0deg,transparent 0 15px,rgba(0,0,0,.45) 15px 17px),
  linear-gradient(180deg,var(--stone-hi),var(--stone));border:1px solid var(--rule)}
.logo .arch::after{content:"";position:absolute;left:50%;bottom:0;width:40px;height:44px;transform:translateX(-50%);border-radius:20px 20px 0 0;background:var(--abyss);box-shadow:inset 0 0 18px rgba(232,165,75,.5)}
.flame{position:absolute;left:50%;width:34px;height:52px;margin-left:-17px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 72%,#fff6dd 0 14%,var(--ember-hi) 26%,var(--ember) 52%,rgba(168,100,31,0) 74%);
  filter:drop-shadow(0 0 14px rgba(232,165,75,.75));transform-origin:50% 90%;animation:flick 1.6s ease-in-out infinite}
.logo .flame{top:4px}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1deg)}35%{transform:scale(.94,1.06) rotate(2deg)}70%{transform:scale(1.04,.96) rotate(-2deg)}}
.title{font-size:clamp(40px,12vw,60px);text-align:center;letter-spacing:.14em;line-height:1;color:var(--ember-hi);text-shadow:0 0 28px rgba(232,165,75,.35)}
.goal{font-style:italic;text-align:center;font-size:18px;color:var(--ink);max-width:32ch;margin-inline:auto}
.home-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.home-actions .btn{font-size:13px;padding-inline:8px;min-height:52px;flex-direction:column;gap:2px}
.home-meta{text-align:center;font-size:14px;color:var(--dim);min-height:1.4em}
.lost-note{color:var(--soul)}

/* play */
#play{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;overflow:hidden;grid-template-areas:"status" "stage" "entry" "keys";
  width:100%;max-width:720px;left:50%;transform:translateX(-50%);background:var(--abyss)}
#play.offscreen{visibility:hidden;pointer-events:none}
.status{grid-area:status;display:flex;align-items:center;gap:10px;padding:8px 12px 4px}
.wave{flex:1;display:flex;gap:3px;align-items:center;justify-content:center;min-width:0}
.notch{flex:0 1 10px;min-width:3px;height:6px;border-radius:2px;background:var(--stone-hi);transition:background .2s}
.notch.on{background:var(--ember)}
.wave.boss .notch{background:var(--bad);animation:pulse 1s ease-in-out infinite}
.tokens{display:flex;gap:6px;color:var(--soul);padding-inline:4px}
.tokens .rune{width:11px;height:11px}
.stage{grid-area:stage;position:relative;min-height:0;margin-inline:8px;border-radius:14px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 100%,rgba(232,165,75,.12),transparent 55%),linear-gradient(180deg,#0f0c13,var(--crypt));
  border:1px solid #221b29}
.stage.veiled .layer,.stage.veiled #fx{visibility:hidden}
.veil{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-family:var(--display);letter-spacing:.2em;font-size:13px}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.layer{position:absolute;inset:0}
.word{position:absolute;left:0;top:0;padding:4px 10px 5px;border-radius:8px;background:rgba(36,29,43,.92);border:1px solid var(--rule);
  font-family:var(--body);font-weight:600;font-size:var(--word-size);line-height:1.15;white-space:nowrap;will-change:transform;color:var(--ink);
  box-shadow:0 4px 14px rgba(0,0,0,.4)}
.word span.on{color:var(--ember-hi)}
.word.target{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 4px 18px rgba(232,165,75,.25)}
.word.hint1{box-shadow:0 0 0 1px rgba(140,200,255,.35),0 4px 14px rgba(0,0,0,.4)}
.word.hinted{outline:2px dashed var(--soul);outline-offset:4px}
.word.lost{background:rgba(20,40,60,.92);border-color:var(--soul);color:#dff0ff;box-shadow:0 0 18px rgba(140,200,255,.55)}
.word .tag{position:absolute;left:50%;top:-16px;transform:translateX(-50%);font-size:10px;font-family:var(--display);letter-spacing:.14em;color:var(--soul);white-space:nowrap}
.word.boss{white-space:normal;width:min(88%,420px);text-align:center;padding:10px 12px 12px;border-color:var(--bad);background:rgba(43,18,24,.94);
  box-shadow:0 0 0 1px rgba(255,95,95,.4),0 0 30px rgba(255,95,95,.25)}
.boss .bname{display:block;font-family:var(--display);font-size:12px;letter-spacing:.18em;color:var(--bad);margin-bottom:4px}
.boss .bw{display:inline-block;margin:0 .22em}
.boss .bw.done{color:var(--faint);text-decoration:line-through}
.boss .bw.cur{color:var(--ink);border-bottom:2px solid var(--bad)}
.boss .bw:not(.cur):not(.done){color:var(--dim)}
.boss .hp{display:flex;justify-content:center;gap:5px;margin-top:6px}
.boss .hp i{width:18px;height:4px;border-radius:2px;background:var(--bad)}
.boss .hp i.gone{background:var(--stone-hi)}

.stones{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--ward-h);width:min(86%,420px);display:flex;flex-direction:column-reverse;gap:4px;padding-bottom:4px}
.stone{height:var(--stone-h);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--soul);border:1.5px solid #4a3d55;
  background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.25) 46px 48px),linear-gradient(180deg,#3b3045,#2a2131)}
.stone.fragile{color:var(--ember-hi);border:1.5px dashed var(--ember);background:rgba(232,165,75,.12)}
.stone.new{animation:lock .4s ease-out}
@keyframes lock{from{transform:scale(1.12);box-shadow:0 0 22px var(--ok);border-color:var(--ok)}}
/* the wall: courses of three bricks */
.course{height:var(--stone-h);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.brick,.slot{min-width:0;border-radius:5px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.brick span{font-family:var(--body);font-weight:600;font-size:12px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding-inline:4px}
.course.open .brick{color:var(--ember-hi);border:1.5px dashed var(--ember);background:rgba(232,165,75,.13)}
.course.sealed .brick{color:var(--soul);border:1.5px solid #4a3d55;
  background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.25) 46px 48px),linear-gradient(180deg,#3b3045,#2a2131)}
.slot{border:1.5px dashed rgba(232,165,75,.28)}
.brick.new{animation:lock .4s ease-out}
.course.sealed.new{animation:seal .7s ease-out}
@keyframes seal{0%{filter:brightness(2.2);box-shadow:0 0 26px var(--soul)}100%{filter:none;box-shadow:none}}
.brick.cracked::after,.stone.cracked::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 46%,var(--bad) 47% 49%,transparent 50%),linear-gradient(60deg,transparent 30%,var(--bad) 31% 33%,transparent 34%)}
.brick.cracked[data-cracks="1"]::after,.stone.cracked[data-cracks="1"]::after{background:linear-gradient(115deg,transparent 46%,var(--bad) 47% 49%,transparent 50%)}
.brick.cracked,.stone.cracked{animation:wobble .3s linear}
.stone{position:relative;overflow:hidden}
.stones.stack{width:min(76%,380px)}
.stage.short{--stone-h:17px}
.stage.short .stone{font-size:10px}
.stage.short .brick span{font-size:10px}
.ward.cracked{box-shadow:inset 0 3px 0 var(--bad)}
@keyframes wobble{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.chip.warn{border-color:var(--ember);background:rgba(232,165,75,.12)}
.chip.warn b{color:var(--ember-hi)}
.entry .typed .ghost{opacity:.9}
/* fused words: a fuse burns along the bottom once the word has landed */
.word.fused{border-color:#ff8a4a;box-shadow:0 0 0 1px rgba(255,138,74,.45),0 4px 14px rgba(0,0,0,.4)}
.word.fused .fuse{position:absolute;left:6px;right:6px;bottom:-4px;height:3px;border-radius:2px;background:#ff8a4a;transform-origin:left center;transform:scaleX(var(--burn,1))}
.word.fused::before{content:"";position:absolute;right:-5px;top:-5px;width:9px;height:9px;border-radius:50%;background:#ffcf8a;box-shadow:0 0 10px #ff8a4a}
.word.burning{background:rgba(70,22,10,.95);animation:burnpulse .35s ease-in-out infinite}
@keyframes burnpulse{50%{box-shadow:0 0 0 2px #ff8a4a,0 0 22px rgba(255,138,74,.7)}}
.rm .word.burning,.rm .course.sealed.new,.rm .brick.cracked,.rm .stone.cracked{animation:none}
.ward{position:absolute;left:0;right:0;bottom:0;height:var(--ward-h);display:flex;flex-direction:row;align-items:center;justify-content:center;gap:14px;
  background:repeating-linear-gradient(0deg,transparent 0 15px,rgba(0,0,0,.4) 15px 17px),
    repeating-linear-gradient(90deg,transparent 0 38px,rgba(0,0,0,.3) 38px 40px),linear-gradient(180deg,var(--stone-hi),var(--stone));
  border-top:2px solid #4a3d55;transition:box-shadow .2s}
.ward.danger{animation:danger .7s ease-in-out infinite}
@keyframes danger{50%{box-shadow:0 -6px 26px rgba(255,95,95,.55);border-top-color:var(--bad)}}
.embers{display:flex;gap:6px;align-items:center}
.embers .more,.streak .more{font-family:var(--display);font-weight:800;font-size:12px;color:var(--ember-hi);font-variant-numeric:tabular-nums}
.streak .more{color:var(--soul)}
.emb{width:11px;height:15px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(ellipse at 50% 70%,#fff2cf 0 15%,var(--ember-hi) 30%,var(--ember) 60%,transparent 76%);
  filter:drop-shadow(0 0 6px rgba(232,165,75,.8));transition:opacity .3s,filter .3s;animation:flick 1.8s ease-in-out infinite}
.emb:nth-child(2){animation-delay:-.4s}.emb:nth-child(3){animation-delay:-.9s}.emb:nth-child(4){animation-delay:-1.2s}
.emb.out{background:radial-gradient(ellipse at 50% 70%,#3a2f42 0 40%,transparent 72%);filter:none;animation:none;opacity:.8}
.streak{display:flex;gap:4px;align-items:center}
.streak i{width:5px;height:5px;border-radius:50%;background:#1b1520;border:1px solid #5c4d68}
.streak i.on{background:var(--soul);border-color:var(--soul);box-shadow:0 0 6px var(--soul)}
.label-tip{position:absolute;font-size:11px;color:var(--dim);font-style:italic;white-space:nowrap;pointer-events:none;transition:opacity .4s}
.reveal{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.1em;color:var(--bad);
  text-shadow:0 0 24px rgba(255,95,95,.6);opacity:0;pointer-events:none}
.reveal small{display:block;font-family:var(--body);font-weight:400;font-size:14px;letter-spacing:0;color:var(--ink);font-style:italic}
.reveal.go{animation:reveal 1.4s ease-out}
@keyframes reveal{0%{opacity:0;transform:scale(1.25)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0}}
.flash{position:absolute;inset:0;background:var(--bad);opacity:0;pointer-events:none}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{from{opacity:.4}to{opacity:0}}
.jolt{animation:jolt .38s linear}
@keyframes jolt{15%{transform:translate(-6px,2px)}30%{transform:translate(5px,-3px)}45%{transform:translate(-4px,3px)}60%{transform:translate(4px,-1px)}80%{transform:translate(-2px,1px)}}
.banner{position:absolute;left:50%;top:10px;transform:translate(-50%,-140%);padding:8px 16px;border-radius:20px;background:var(--ember);color:#2a1606;
  font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.06em;white-space:nowrap;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);z-index:3;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.banner.on{transform:translate(-50%,0)}
.count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:52px;letter-spacing:.12em;color:var(--ember-hi);
  text-shadow:0 0 30px rgba(232,165,75,.6);pointer-events:none}
.count span{animation:countin .6s ease-out}
@keyframes countin{from{transform:scale(1.6);opacity:0}}

.entry-row{grid-area:entry;display:flex;gap:6px;margin:8px 8px 0;min-width:0}
.entry{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 12px;min-height:44px;border-radius:10px;background:var(--crypt);border:1px solid var(--rule);
  font-family:var(--body);font-weight:600;font-size:20px;position:relative;overflow:hidden}
.entry .typed{letter-spacing:.04em;white-space:nowrap;overflow:hidden;flex:1;min-width:0}
.entry .typed .bad{color:var(--bad)}
.entry .caret{width:2px;height:22px;background:var(--ember);animation:blink 1s steps(2) infinite;margin-left:-6px}
@keyframes blink{50%{opacity:0}}
.entry.wrong{border-color:var(--bad);animation:jolt .35s linear}
.entry.fade .typed{opacity:0;transition:opacity .4s}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:400;padding:3px 9px;border-radius:12px;border:1px solid var(--bad);color:var(--ink);background:rgba(255,95,95,.12);white-space:nowrap;max-width:62%;overflow:hidden;text-overflow:ellipsis}
.chip b{color:var(--bad);font-weight:600}
.chip.ok{border-color:var(--ok);background:rgba(111,220,140,.12)}
.chip.ok b{color:var(--ok)}
.chip[hidden]{display:none}

.tools{display:flex;gap:6px;flex:none}
.tool{min-width:44px;padding:0 10px;min-height:44px;border-radius:10px;border:1px solid var(--rule);background:var(--crypt);font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.1em;
  display:flex;align-items:center;justify-content:center;gap:8px;color:var(--soul)}
.tool .cost{display:flex;gap:3px}
.tool{flex-direction:column;gap:2px;font-size:11px;letter-spacing:.08em}
.kb-glyph{width:20px;height:12px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 5px) 0 0/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 5px) 1px 5px/100% 3px no-repeat,linear-gradient(var(--ink),var(--ink)) 4px 10px/12px 2px no-repeat}
@media (max-width:380px){ .tool .tl{display:none} .tool{padding:0 8px} }
.tool .rune{width:8px;height:8px}
.tool[disabled]{opacity:.35}

.keys{grid-area:keys;display:flex;flex-direction:column;gap:6px;padding:8px 4px calc(10px + env(safe-area-inset-bottom,0px));direction:ltr;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.krow{display:flex;gap:5px;justify-content:center}
.krow.mid{padding-inline:5%}
.key{flex:1;max-width:58px;min-width:26px;height:var(--key-h);border-radius:7px;border:0;background:#2c2433;color:var(--ink);font-family:var(--body);font-weight:600;font-size:20px;
  display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 2px 0 #0a080c;padding:0}
.key.fn{flex:1.5;max-width:86px;font-family:var(--display);font-size:12px;letter-spacing:.08em;background:#3a3042}
.key.down{background:var(--ink);color:var(--abyss);transform:translateY(1px);box-shadow:none}
.key.hint1{box-shadow:0 0 0 2px rgba(140,200,255,.45),0 2px 0 #0a080c}
.key.hint2{box-shadow:0 0 0 2px var(--soul),0 2px 0 #0a080c}
.key.next{animation:keypulse .8s ease-in-out infinite}
@keyframes keypulse{50%{background:rgba(140,200,255,.35)}}
.pop{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);min-width:44px;height:52px;border-radius:9px;background:var(--ink);color:var(--abyss);
  display:grid;place-items:center;font-size:28px;font-weight:600;pointer-events:none;z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.krow.bottom{gap:8px;padding-inline:4px}
.kbtn{flex:1;min-height:var(--key-h);border-radius:9px;border:1px solid;font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.12em}
.kbtn.clear{border-color:var(--bad);color:var(--bad);background:rgba(255,95,95,.08)}
.kbtn.enter{border-color:var(--ok);color:#06200f;background:var(--ok)}

.status{position:relative}
.kb-input{position:absolute;left:50%;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;margin:0;font-size:16px;pointer-events:none;caret-color:transparent}
.tap-type{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:14px;
  background:rgba(13,11,16,.86);color:var(--ember-hi);font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.12em}
.tap-type .rune{width:12px;height:12px}
.typing-pick{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.step-h{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:13px}
.step-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--ember);color:#2a1606;font-size:12px;letter-spacing:0}
.type-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.type-tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;border-radius:14px;border:2px solid var(--rule);background:var(--crypt);color:var(--ink);text-align:left;min-height:96px;min-width:0}
.type-tile b{font-family:var(--display);font-size:15px;letter-spacing:.06em}
.type-tile span:not(.tt-ico){font-size:13px;color:var(--dim);line-height:1.3}
.type-tile[aria-pressed="true"]{border-color:var(--ember);background:linear-gradient(180deg,rgba(232,165,75,.18),rgba(232,165,75,.06));box-shadow:0 0 0 1px var(--ember)}
.type-tile[aria-pressed="true"] b{color:var(--ember-hi)}
.tt-ico{width:40px;height:22px;border-radius:4px;margin-bottom:2px}
.keys-ico{background:repeating-linear-gradient(90deg,var(--stone-hi) 0 7px,transparent 7px 9px) 0 0/100% 6px no-repeat,repeating-linear-gradient(90deg,var(--stone-hi) 0 7px,transparent 7px 9px) 3px 8px/100% 6px no-repeat,repeating-linear-gradient(90deg,var(--stone-hi) 0 7px,transparent 7px 9px) 6px 16px/80% 6px no-repeat}
.dev-ico{width:22px;height:32px;border:2px solid var(--dim);border-radius:5px;background:linear-gradient(transparent 55%,var(--stone-hi) 55% 85%,transparent 85%)}
.type-tile[aria-pressed="true"] .keys-ico{filter:sepia(1) saturate(4) hue-rotate(-10deg) brightness(1.2)}
.type-tile[aria-pressed="true"] .dev-ico{border-color:var(--ember)}

/* bosses: name and health in the status row; the weak point glows at the top of the field when open */
.boss-bar{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:10px;border:1px solid rgba(255,95,95,.45);
  background:linear-gradient(180deg,rgba(43,18,24,.96),rgba(30,14,20,.94))}
.boss-bar.tele{animation:tele .45s ease-in-out infinite;border-color:var(--atk)}
@keyframes tele{50%{box-shadow:0 0 0 2px var(--atk),0 0 18px var(--atk)}}
.boss-bar.phase2{border-color:var(--bad);background:linear-gradient(180deg,rgba(66,14,18,.97),rgba(36,10,14,.95))}
.boss-bar.open{border-color:var(--ok)}
.bb-name{font-family:var(--display);font-weight:800;font-size:12px;letter-spacing:.1em;color:#ffc9c9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.bb-hp{display:flex;gap:2px;flex:none}
.bb-hp i{width:8px;height:5px;border-radius:2px;background:var(--bad)}
.bb-hp i.gone{background:var(--stone-hi)}
.boss-weak{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
.bw-word{font-family:var(--body);font-weight:600;font-size:calc(var(--word-size) + 2px);letter-spacing:.04em;color:var(--ink);padding:2px 12px 3px;border-radius:8px;
  background:rgba(20,40,26,.92);border:1.5px solid var(--ok);box-shadow:0 0 18px rgba(111,220,140,.35);white-space:nowrap}
.bw-word span.on{color:var(--ember-hi)}
.boss-weak.target .bw-word{border-color:var(--ember)}
.bw-guard{display:flex;align-items:center;gap:6px;color:var(--faint);font-family:var(--display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:10px;border:1px dashed #4a3d55}
.bw-guard .rune{width:7px;height:7px}
.bw-window{height:3px;width:100%;border-radius:2px;background:var(--ok);transform-origin:left;transform:scaleX(var(--win,1))}
.chip.note,.chip.gold,.chip.atk,.chip.ok{white-space:normal;line-height:1.2;max-width:78%;font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chip.note{border-color:var(--rule);background:rgba(36,29,43,.9)}
.chip.note b{color:var(--ink)}
.chip.gold{border-color:var(--ember);background:rgba(232,165,75,.14)}
.chip.gold b{color:var(--ember-hi)}
.chip.atk{border-color:var(--atk,var(--bad));background:rgba(255,95,95,.1)}
.chip.atk b{color:var(--atk,var(--bad))}
.rm .boss-bar.tele{animation:none;box-shadow:0 0 0 2px var(--atk)}
.dark{position:absolute;left:0;right:0;top:0;bottom:var(--ward-h);z-index:1;pointer-events:none;
  /* darkness rolls over the whole field in waves; --dk is how dark it is right now */
  background:rgba(4,3,6,.985);opacity:var(--dk,1)}
.word.atk{border-color:rgba(255,95,95,.55)}
.word.mirror{display:inline-flex;flex-direction:row-reverse;border-color:#9fb6ff}
.word.echo,.word .echo-tag{color:#f2c74e}
.word.echo{border:2px double #f2c74e}
.word.heavy{border:2px solid #ff8a4a;background:rgba(70,22,10,.94);font-size:calc(var(--word-size) + 2px)}
.word .heavy-tag{color:#ff8a4a}
.word.mossy{border-color:#7fcf8a;background:rgba(24,44,28,.94)}
.word span.ice{color:#bfe6ff;text-shadow:0 0 8px rgba(191,230,255,.8)}
.rm .boss-panel.tele{animation:none;box-shadow:0 0 0 2px var(--atk)}

/* overlays */
.overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:safe center;justify-content:center;padding:16px;
  background:rgba(8,6,10,.72);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);overflow-y:auto}
.panel{width:100%;max-width:440px;border-radius:16px;border:1px solid var(--rule);background:var(--crypt);padding:20px;display:flex;flex-direction:column;gap:14px;margin:auto}
.panel h2{text-align:center;color:var(--ember-hi)}
.btn-col{display:flex;flex-direction:column;gap:8px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--ember)}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:10px 8px;border-radius:10px;background:var(--stone);text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--dim)}
#toast{position:absolute;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;z-index:40;padding:9px 16px;border-radius:12px;
  background:var(--stone-hi);border:1px solid var(--rule);font-size:14px;max-width:min(92vw,420px);text-align:center;transition:opacity .25s,transform .25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#app.in-play #toast{top:calc(64px + env(safe-area-inset-top,0px))}

#fallen{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 50%,rgba(60,10,14,.85),rgba(5,3,6,.97));text-align:center;padding:24px}
#fallen h1{font-size:clamp(30px,9vw,52px);color:#e9443f;letter-spacing:.12em;text-shadow:0 0 30px rgba(233,68,63,.5);animation:fallin 1.6s ease-out both}
#fallen p{margin-top:10px;color:var(--dim);font-style:italic;animation:fallin 1.6s .4s ease-out both}
#fallen.left h1{color:var(--ember-hi);text-shadow:0 0 30px rgba(232,165,75,.4)}
@keyframes fallin{from{opacity:0;letter-spacing:.4em}}

/* tour */
#tour{position:absolute;inset:0;z-index:50}
.spot{position:absolute;border-radius:14px;box-shadow:0 0 0 200vmax rgba(5,4,8,.8);border:2px solid var(--ember);transition:all .3s ease;pointer-events:none}
.tcard{position:absolute;width:min(330px,calc(100vw - 24px));border-radius:14px;background:var(--crypt);border:1px solid var(--ember-lo);padding:14px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.6)}
.tcard h3{color:var(--ember-hi);font-size:14px}
.tcard p{font-size:15px}
.tfoot{display:flex;align-items:center;gap:8px}
.tfoot .stepn{flex:1;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.tfoot .btn{min-height:44px;padding:6px 14px;font-size:13px}

/* tour demos: tiny looping scenes */
.demo{position:relative;height:96px;border-radius:10px;overflow:hidden;background:linear-gradient(180deg,#0f0c13,var(--stone));border:1px solid var(--rule)}
.demo .dw{position:absolute;left:50%;top:6px;transform:translateX(-50%);padding:2px 8px;border-radius:6px;background:var(--stone-hi);border:1px solid var(--rule);font-weight:600;font-size:14px}
.demo .dwall{position:absolute;left:0;right:0;bottom:0;height:20px;background:repeating-linear-gradient(90deg,transparent 0 24px,rgba(0,0,0,.35) 24px 26px),linear-gradient(180deg,var(--stone-hi),var(--stone));border-top:1px solid #4a3d55}
.demo .demb{position:absolute;bottom:3px;left:50%;width:10px;height:14px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 50% 70%,#fff2cf 0 18%,var(--ember) 55%,transparent 72%)}
.demo .dst{position:absolute;left:25%;right:25%;height:14px;border-radius:3px;font-family:var(--display);font-size:9px;letter-spacing:.14em;display:grid;place-items:center;text-transform:uppercase}
.demo .dst.solid{bottom:22px;background:#3b3045;border:1px solid #4a3d55;color:var(--soul)}
.demo .dst.frag{bottom:38px;border:1px dashed var(--ember);color:var(--ember-hi);background:rgba(232,165,75,.12)}
.demo .dtyped{position:absolute;right:8px;top:8px;font-size:12px;color:var(--ember-hi)}
.demo .dchip{position:absolute;left:8px;top:8px;font-size:11px;padding:1px 6px;border-radius:8px;border:1px solid var(--bad);color:var(--bad);opacity:0}
.demo .dkey{position:absolute;right:10px;bottom:30px;width:22px;height:24px;border-radius:5px;background:#2c2433;display:grid;place-items:center;font-size:12px;font-weight:600}
.d-fall .dw{animation:dfall 3.2s linear infinite}
@keyframes dfall{0%{top:4px}80%,100%{top:52px}}
.d-lock .dw,.d-lockS .dw{animation:dlockw 3.2s ease-in infinite}
.d-lockS .dst.frag{animation:dlocks 3.2s ease-out infinite}
.d-lock .dtyped{animation:dtype 3.2s steps(1) infinite}
@keyframes dlockw{0%{top:4px;opacity:1}45%{top:26px;opacity:1}52%,100%{top:26px;opacity:0}}
@keyframes dlocks{0%,50%{opacity:0;transform:scale(1.2)}58%{opacity:1;transform:scale(1.1);box-shadow:0 0 14px var(--ok)}100%{opacity:1;transform:none}}
@keyframes dtype{0%{content:""}}
.d-typoS .dst.frag{animation:dtypo 3.2s ease-in infinite}
.d-typo .dchip,.d-typoS .dchip{animation:dchip 3.2s ease-out infinite}
@keyframes dtypo{0%,40%{opacity:1;transform:none}45%{transform:translateX(-4px)}50%{transform:translateX(4px)}55%,100%{opacity:0;transform:scale(1.3)}}
@keyframes dchip{0%,38%{opacity:0}45%,85%{opacity:1}100%{opacity:0}}
.d-hit .dw{animation:dhit 3.2s ease-in infinite}
.d-hit .demb{animation:demb 3.2s steps(1) infinite}
.d-hit .dflash{position:absolute;inset:0;background:var(--bad);opacity:0;animation:dflash 3.2s ease-out infinite}
@keyframes dhit{0%{top:4px;opacity:1}60%{top:56px;opacity:1}64%,100%{top:56px;opacity:0}}
@keyframes demb{0%,60%{opacity:1}61%,100%{opacity:.15}}
@keyframes dflash{0%,59%{opacity:0}62%{opacity:.4}80%,100%{opacity:0}}
.d-hint .dw{animation:dhint 3.6s ease-in-out infinite}
.d-hint .dkey{animation:dkey 3.6s ease-in-out infinite}
@keyframes dhint{0%{top:4px;outline:0}40%{top:46px;outline:0}48%{top:46px;outline:2px dashed var(--soul);outline-offset:3px}70%,100%{top:22px;outline:2px dashed var(--soul);outline-offset:3px}}
@keyframes dkey{0%,44%{box-shadow:none}50%,100%{box-shadow:0 0 0 2px var(--soul)}}

.d-lock .db.b3{animation:dlocks 3.2s ease-out infinite}
.d-lock .drow{animation:dseal 3.2s ease-out infinite}
@keyframes dseal{0%,58%{filter:none}64%{filter:brightness(1.8)}100%{filter:none}}
.drow{position:absolute;left:18%;right:18%;bottom:22px;height:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.drow.up{bottom:39px}
.db{border-radius:3px;font-family:var(--body);font-weight:600;font-size:9px;font-style:normal;display:grid;place-items:center;border:1px dashed var(--ember);color:var(--ember-hi);background:rgba(232,165,75,.12)}
.drow.seal .db{border:1px solid #4a3d55;background:#3b3045;color:var(--soul)}
.ds{border:1px dashed rgba(232,165,75,.3);border-radius:3px}
.d-typo .db.b2{animation:dtypo 3.2s ease-in infinite}
.d-fused .dw.fz{border-color:#ff8a4a;animation:dfz 3.6s ease-in infinite}
.d-fused .dw.fz i{position:absolute;left:4px;right:4px;bottom:-3px;height:2px;background:#ff8a4a;transform-origin:left;animation:dfuse 3.6s linear infinite}
.d-fused .db.f1,.d-fused .db.f2{animation:dboom 3.6s steps(1) infinite}
@keyframes dfz{0%{top:4px;opacity:1}40%,85%{top:42px;opacity:1}86%,100%{top:42px;opacity:0}}
@keyframes dfuse{0%,40%{transform:scaleX(1)}85%,100%{transform:scaleX(0)}}
@keyframes dboom{0%,85%{opacity:1}86%,100%{opacity:0}}

/* choose your path */
.path-list{display:grid;gap:10px}
.path-card{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--rule);background:var(--crypt);color:var(--ink);min-height:44px}
.path-card:active{transform:scale(.99)}
.path-card.last{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember)}
.path-go{margin-top:4px}
.pc-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pc-name{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.08em}
.pc-plain{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.path-card.pilgrim .pc-name{color:var(--ok)}
.path-card.knight .pc-name{color:var(--ember-hi)}
.path-card.ashen .pc-name{color:#ff8a4a}
.pc-line{font-size:15px;color:var(--dim)}
.pc-marks{margin-left:auto;display:flex;gap:6px;color:var(--ember)}
.pc-marks .rune{width:9px;height:9px}
.path-card.ashen .pc-marks{color:#ff8a4a}.path-card.pilgrim .pc-marks{color:var(--ok)}
.pc-foot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.compare-btn{align-self:center;min-height:44px;font-size:13px}
.compare-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:12px}
.compare{border-collapse:collapse;width:100%;min-width:440px;font-size:13px;line-height:1.35}
.compare th,.compare td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule)}
.compare thead th{font-family:var(--display);letter-spacing:.06em}
.compare tbody th{font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.compare th.pilgrim{color:var(--ok)}.compare th.knight{color:var(--ember-hi)}.compare th.ashen{color:#ff8a4a}
.pc-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pc-facts span{display:flex;flex-direction:column;gap:1px;font-size:12.5px;line-height:1.3;color:var(--dim);padding:6px 8px;border-radius:8px;background:var(--stone);min-width:0}
.pc-facts b{font-family:var(--display);font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.pc-best{font-size:13px;color:var(--ember-hi)}
.pc-last{position:absolute;right:12px;top:12px;font-size:11px;font-family:var(--display);letter-spacing:.1em;color:var(--ember)}
@media (max-width:380px){ .pc-facts{grid-template-columns:minmax(0,1fr)} .pc-facts span{flex-direction:row;gap:6px;align-items:baseline} }
@media (min-width:860px){ .path-list{grid-template-columns:repeat(3,minmax(0,1fr))} #path .page{max-width:900px} }
.tabs.center{justify-content:center}
.keys-tool{color:var(--ink)}

/* results / board / codex */
.hero-num{font-family:var(--display);font-weight:800;font-size:64px;line-height:1;text-align:center;color:var(--ember-hi);font-variant-numeric:tabular-nums;text-shadow:0 0 26px rgba(232,165,75,.4)}
.hero-cap{text-align:center;color:var(--dim);font-size:14px;margin-top:-10px}
.pb{align-self:center;padding:5px 14px;border-radius:14px;background:var(--ember);color:#2a1606;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.1em}
.medals{display:flex;justify-content:center;gap:18px}
.medal{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.medal .m{width:30px;height:30px;transform:rotate(45deg);border-radius:4px;border:2px solid var(--stone-hi);background:var(--stone)}
.medal.got .m{border-color:var(--c);background:var(--c);box-shadow:0 0 14px var(--c)}
.medal.got{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{padding:3px 9px;border-radius:12px;background:var(--stone);font-size:14px;border:1px solid transparent}
.wchip.hinted{background:transparent;border:1px dashed var(--soul);color:var(--soul)}
.wchip.boss{border-color:var(--bad);color:#ffc9c9}
.wchip.lost{border-color:var(--soul);color:var(--soul);background:rgba(140,200,255,.1)}
.wchip.missing{color:var(--faint)}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;margin-top:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod .nm{font-family:var(--display);font-weight:600;font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .sc{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.pod .blk{width:100%;border-radius:10px 10px 0 0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:30px;color:#20140a}
.pod.p1 .blk{height:120px;background:linear-gradient(180deg,#ffe08a,#c9971e)}
.pod.p2 .blk{height:88px;background:linear-gradient(180deg,#e8e8f0,#9d9daa)}
.pod.p3 .blk{height:66px;background:linear-gradient(180deg,#f0b27a,#a8642f)}
.pod.me .nm{color:var(--ember-hi)}
.lb-rows{display:flex;flex-direction:column;gap:4px}
.lb-row{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--stone);font-size:17px}
.lb-row .r{font-family:var(--display);font-weight:600;color:var(--dim);font-variant-numeric:tabular-nums}
.lb-row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .s{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.lb-row.me{background:var(--ember-lo);color:#fff4e0}
.lb-gap{text-align:center;color:var(--faint);letter-spacing:.3em}
.calm-tag{font-size:11px;color:var(--soul);margin-left:6px;font-family:var(--body)}
.rule-line{text-align:center;font-size:14px;color:var(--dim);font-style:italic}
.empty{padding:22px;text-align:center;color:var(--dim);border:1px dashed var(--rule);border-radius:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--rule);background:var(--crypt);font-family:var(--display);font-size:13px;letter-spacing:.06em}
.tabs button[aria-pressed="true"]{background:var(--ember);color:#2a1606;border-color:var(--ember)}
.boss-list{display:flex;flex-direction:column;gap:6px}
.boss-item{padding:10px 12px;border-radius:10px;background:var(--stone);display:flex;flex-direction:column;gap:2px}
.boss-item b{font-family:var(--display);font-weight:600;letter-spacing:.06em}
.boss-item.locked{color:var(--faint)}
.sheet{display:flex;flex-direction:column;gap:12px;font-size:15px}
.sheet ol{margin:0;padding-left:1.3em}
.credits{font-size:13px;color:var(--dim);display:flex;flex-direction:column;gap:6px}
.credits a{color:var(--soul)}
#splash{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--abyss)}
#splash .bar{width:200px;height:4px;border-radius:2px;background:var(--stone);overflow:hidden}
#splash .bar i{display:block;height:100%;width:0;background:var(--ember);transition:width .2s}

@media (min-width:700px) and (min-height:900px){
  :root{--key-h:56px;--stone-h:28px;--ward-h:48px;--word-size:26px}
  .key{max-width:66px;font-size:24px}
}
@media (min-width:1000px){ :root{--word-size:24px} }
/* phone on its side: stage left, controls right */
@media (orientation:landscape) and (max-height:520px){
  :root{--key-h:40px;--stone-h:18px;--ward-h:34px;--word-size:17px}
  #play{max-width:none;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);
    grid-template-areas:"status status" "stage entry" "stage keys"}
  .stage{margin:0 0 8px 8px;padding-left:env(safe-area-inset-left,0px)}
  .entry-row{margin-top:0}.entry{min-height:40px}
  .tool{min-height:40px}
  .keys{padding-top:6px;gap:5px;padding-right:calc(4px + env(safe-area-inset-right,0px))}
  .status{padding-top:4px}
  .brick span{font-size:10.5px}
  .ward{gap:10px}
  .home-actions .btn{min-height:46px}
  #home .logo{transform:scale(.7);margin-block:-20px}
}
@media (prefers-reduced-motion:reduce){ .flame,.emb{animation:none} }
.rm .flame,.rm .emb,.rm .key.next,.rm .ward.danger,.rm .wave.boss .notch{animation:none}
.rm .jolt,.rm .entry.wrong{animation:none}
.rm .flash.go{animation:fade .5s}
.rm .stone.new{animation:fade .3s}
.rm .banner{transition:opacity .3s;transform:translate(-50%,0);opacity:0}
.rm .banner.on{opacity:1}
.rm .demo *{animation-duration:0s!important;animation-iteration-count:1!important}
.rm .ward.danger{box-shadow:0 -4px 20px rgba(255,95,95,.55);border-top-color:var(--bad)}
@keyframes fade{from{opacity:0}}
@keyframes pulse{50%{opacity:.4}}
</style>

<div id="app">
  <div id="sr" class="sr" aria-live="polite"></div>
  <div id="toast" role="status"></div>

  <!-- HOME -->
  <section id="home" class="screen scroll bg-runes" hidden>
    <div class="page">
      <div class="event-row">
        <div class="lbl"><b data-i="eventMode"></b><span class="event-note" id="eventNote" data-i="eventNote" hidden></span></div>
        <button class="switch" id="homeEvent" role="switch" aria-checked="false" data-ia="eventMode"></button>
      </div>
      <div class="logo" aria-hidden="true"><div class="flame"></div><div class="arch"></div></div>
      <h1 class="title">Soulward</h1>
      <p class="goal" data-i="goal"></p>
      <button class="btn primary wide" id="playBtn" data-i="play"></button>
      <p class="home-meta" id="homeMeta"></p>
      <div class="home-actions">
        <button class="btn" id="homeHelp"><span class="icon-sm" aria-hidden="true">i</span><span data-i="howTo"></span></button>
        <button class="btn" id="homeCodex"><span class="rune" aria-hidden="true"></span><span data-i="codex"></span></button>
        <button class="btn" id="homeSettings"><span aria-hidden="true">⚙</span><span data-i="settings"></span></button>
      </div>
      <button class="btn wide" id="homeBoard" hidden data-i="leaderboard"></button>
      <div class="divider"><span class="rune fill"></span></div>
    </div>
  </section>

  <!-- NAME (event) -->
  <section id="name" class="screen scroll bg-runes" hidden>
    <div class="page">
      <button class="btn ghost back" data-back="home" data-i="backMenu"></button>
      <h2 data-i="whoPlays"></h2>
      <p class="muted" id="nameDiff"></p>
      <label class="sr" for="nameInput" data-i="yourName"></label>
      <input id="nameInput" maxlength="16" autocomplete="off" spellcheck="false"
        style="min-height:52px;border-radius:10px;border:1px solid var(--rule);background:var(--crypt);color:var(--ink);font:600 20px var(--body);padding:0 14px">
      <label class="check"><input type="checkbox" id="nameTour"><span data-i="showMeFirst"></span></label>
      <button class="btn primary wide" id="nameGo" data-i="startTurn"></button>
      <h3 data-i="top5"></h3>
      <div id="nameTop" class="lb-rows"></div>
    </div>
  </section>

  <!-- PATH (difficulty) -->
  <section id="path" class="screen scroll bg-runes" hidden>
    <div class="page" id="pathPage"></div>
  </section>

  <!-- PLAY -->
  <section id="play" class="screen offscreen" aria-label="Soulward">
    <div class="status">
      <input id="kbInput" class="kb-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="done" aria-label="Type here" tabindex="-1">
      <button class="icon-btn" id="playHelp" data-ia="howTo">i</button>
      <div class="wave" id="wave" aria-hidden="true"></div>
      <div class="boss-bar" id="bossBar" hidden></div>
      <div class="tokens" id="tokens" aria-hidden="true"></div>
      <button class="icon-btn" id="pauseBtn" data-ia="pause"><span class="bars" aria-hidden="true"><i></i><i></i></span></button>
    </div>
    <div class="stage" id="stage">
      <canvas id="fx"></canvas>

const KEY = 'soulward.v1';
const DIFF_KEYS_ALL = ['pilgrim', 'knight', 'ashen'];
const reduceSys = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const DEFAULTS = () => ({
  v: 1,
  settings: { sound: true, motion: reduceSys, hints: true, lang: 'en', shrine: true, confirm: false, event: false,
    diff: null, eventDiff: 'knight', keys: true, keysAuto: true, typing: 'keys' },
  bestBy: { pilgrim: 0, knight: 0, ashen: 0 }, toured: false, plays: 0, seen: [], codex: { words: {}, bosses: [] }, board: [], lost: null, playerN: 0
});
let storageOK = true, warnedStorage = false;
function loadSave() {
  const d = DEFAULTS();
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return d;
    const s = JSON.parse(raw);
    if (!s || s.v !== 1) return d;
    const out = Object.assign(d, s, { settings: Object.assign(d.settings, s.settings || {}), codex: Object.assign(d.codex, s.codex || {}), bestBy: Object.assign(d.bestBy, s.bestBy || {}) });
    // v1.0 kept one best score; every v1.0 run was today's Knight rules
    if (typeof s.best === 'number' && !s.bestBy) out.bestBy.knight = s.best;
    delete out.best;
    if (!DIFF_KEYS_ALL.includes(out.settings.eventDiff)) out.settings.eventDiff = 'knight';
    if (out.settings.diff && !DIFF_KEYS_ALL.includes(out.settings.diff)) out.settings.diff = null;

  } catch (e) { storageOK = false; return d; }
}

/* ---------------- input ---------------- */

let fadeTimer = 0;

  } else { clearTimeout(fadeTimer); entry.classList.remove('fade', 'wrong'); g.fading = false; g.buffer = ''; g.target = null; renderEntry(); }
}
function handleKey(k) {

  if (k === 'enter') { if (S().confirm) submitConfirm(); return; }

/* The slip rule.

     your fingers carry on through costs one brick, not five.

  if (midWord) { g.lastSlipAt = g.clock; g.lastSlipTarget = tgt; }

function candidatesFor(c) {

  removeWord(w);

  renderStones(); renderHUD();

}
/* One unit of damage from a word that lands.
   Pilgrim, Knight: the top stone. Ashen: the word passes through the unfinished row (leaving it)
   and destroys the top sealed row; with no sealed row it reaches the flame.
   Returns the damage the wall could not take (hearts). */
function damageWall(n) {
  let left = n;
  while (left > 0) {
    if (g.D.grid) {
      let i = -1; for (let j = g.wall.length - 1; j >= 0; j--) if (g.wall[j].sealed) { i = j; break; }
      if (i < 0) break;
      g.wall.splice(i, 1)[0].bricks.forEach(b => shatter(b, '#a99db0'));
      toast(t('layerLost'));
    } else {
      if (!g.wall.length) break;
      shatter(takeTopBrick(), '#a99db0');
    }
    say(t('srStone')); left--;
  }
  return left;
}
// a fused word that burns out explodes for two: bricks first, then hearts for whatever is left
function explode(w) {
  g.streak = 0;
  let dmg = 2;
  while (dmg > 0 && g.wall.length) { shatter(takeTopBrick(), '#ff8a4a'); dmg--; }
  renderStones();
  burst(w.x + w.w / 2, w.y + w.h / 2, '#ff8a4a', 24, 3);
  SFX.boom(); buzz([40, 30, 80]);
  if (motionOn()) { stage.classList.remove('jolt'); void stage.offsetWidth; stage.classList.add('jolt'); }
  toast(t('exploded'));
  const text = w.text;
  if (g.target === w.id) clearBuffer(false);
  removeWord(w);

}
// the flame loses embers, loudly
function loseHearts(n, text, isBoss) {

  rv.classList.remove('go'); void rv.offsetWidth; rv.classList.add('go');
  if (motionOn()) { stage.classList.remove('jolt'); void stage.offsetWidth; stage.classList.add('jolt'); }
  const fl = $('#flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
  burst(geo.w / 2, geo.wardTop, '#ff5f5f', 18, 4);
  say(t('srHit', { n: g.hearts }));

function banner(msg, ms = 2300) { if (current === 'play') { playNote(msg, 'gold', ms); return; } const b = $('#banner'); b.textContent = msg; b.classList.add('on'); clearTimeout(bannerTimer); bannerTimer = setTimeout(() => b.classList.remove('on'), ms); }
function checkBest() {

  if (!g.nearShown && g.score < best && best - g.score <= 6) { g.nearShown = true; banner(t('nearBest')); }

/* ---------------- main loop ---------------- */
let raf = 0, lastT = 0;
function wake() { if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(frame); } }
function frame(now) {
  raf = 0;
  const dt = Math.min(50, now - lastT); lastT = now;
  const live = g && g.running && !g.paused && !g.countdown && current === 'play' && !kbWaiting();
  if (live) step(dt);
  drawFx(dt);
  if (live || fxActive > 0) raf = requestAnimationFrame(frame);
}
function step(dt) {
  g.clock += dt; g.playMs += dt;
  if (g.timers.length) { const due = g.timers.filter(x => x.at <= g.clock); g.timers = g.timers.filter(x => x.at > g.clock); due.forEach(x => x.fn()); if (!g.running || g.paused) return; }
  // spawning
  if (!g.boss && !g.inShrine && !g.hold) {
    if (g.waveCount >= 15) { if (!g.words.length && !g.bossPending) { g.bossPending = true; later(700, () => { if (g.running && !g.boss) announceBoss(); }); } }
    else if (g.words.length < maxActive() && g.clock >= g.nextSpawn) {
      let text = null, lost = false;
      if (g.lost && !g.lostSpawned && g.locked >= 5 && !g.words.some(w => w.text[0] === g.lost.word[0])) { text = g.lost.word; lost = true; g.lostSpawned = true; }
      else text = pickWord();
      const fused = !lost && g.D.fused > 0 && g.locked >= 5 && Math.random() < g.D.fused;
      if (text) spawn(text, { lost, fused, fall: fused ? Math.round(fallMs() / 1.6) : 0 }); // fused words fall 1.6x faster: choose which to type first
      const f = fallMs();
      g.nextSpawn = g.clock + Math.max(1100, f * (g.words.length >= 2 ? 0.42 : 0.3));
    }
  }
  if (g.bossPending && g.boss) g.bossPending = false; // the boss is down; the next wave may call another
  // movement
  const top = stackTop();
  const moveOne = w => {
    if (w.landed) { // burning on top of the wall; it rides the wall up and down as bricks come and go
      w.burn += dt;
      w.y = Math.max(0, top - 2 - w.h);
      w.el.style.transform = `translate(${w.x}px,${w.y}px)`;
      w.el.style.setProperty('--burn', String(clamp(1 - w.burn / g.D.fuseMs, 0, 1)));
      if (w.burn >= g.D.fuseMs) explode(w);
      return;
    }
    if (w.lift > 0) { const s = Math.min(w.lift, w.liftRate * dt); w.d -= s; w.lift -= s; }
    else w.d += dt / w.fall;
    const lim = Math.max(1, geo.wardTop - w.h);
    w.y = w.y0 + w.d * Math.max(1, lim - w.y0);
    w.el.style.transform = `translate(${w.x}px,${w.y}px)`;
    if (w.y + w.h >= top - 2) wordHits(w);
  };
  for (const w of g.words.slice()) moveOne(w);
  if (!g.running) return;
  if (g.boss) bossTick(dt);
  if (!g.running) return;
  autoHints();
  // danger: the nearest word in the last 30% of its path
  let maxF = 0; for (const w of g.words) maxF = Math.max(maxF, frac(w));
  const danger = maxF >= 0.7;
  if (danger !== g.danger) { g.danger = danger; wardEl.classList.toggle('danger', danger); }
  if (danger && g.clock - g.lastBeat > 760) { g.lastBeat = g.clock; SFX.beat(); }
  if (g.tipUntil && g.playMs > g.tipUntil) { g.tipUntil = 0; placeTips(); }
}

function endGame(reason) {

/* ---------------- typing with the device's own keyboard ----------------

   - keydown always says "Unidentified" (229), so letters are read from beforeinput, one per event,
     and cancelled so the box never fills and the keyboard has no word to autocorrect.
   - The box always holds one space so Backspace has something to delete.
   - Inserts with more than one letter (a suggestion tap, swipe typing) are refused; "n " (letter + auto space) counts as n.
   - In the Claude app any tap closes the keyboard unless touchstart and mousedown are cancelled too ("Hold B").
   - Brave doesn't shrink the page for the keyboard; it slides the view up. So the game sizes itself to the visual viewport. */

function holdTap(el, fn) { // a button that never steals focus from the typing box (the "Hold B" result)
  el.addEventListener('pointerdown', e => { e.preventDefault(); fn(e); });
  el.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  el.addEventListener('mousedown', e => e.preventDefault());
  el.addEventListener('click', e => { if (e.detail === 0) fn(e); }); // Enter or Space on a focused button

}

function kbLetters(str) {
  const d = String(str).toLowerCase().replace(/\s+/g, '');
  if (!d) { if (/\s/.test(str)) handleKey('clear'); return; } // the space bar drops the word, at no cost
  if (/^[a-z]$/.test(d)) { handleKey(d); return; }

kbIn.addEventListener('keydown', () => { kbTyped = true; });
/* Round 2 of field results: cancelling every letter left Gboard believing one endless word was typed
   ("mightsunfallcross..." in its suggestion bar). So a single letter now lands in the box natively,
   keeping the keyboard and the box in agreement; the game reads it from the change, then sets the box

   keyboard the real text, so its suggestions follow the current word and clear when it locks. */

['touchstart', 'mousedown'].forEach(ev => stage.addEventListener(ev, e => { if (devKb() && g && g.running && !e.target.closest('#tapType')) e.preventDefault(); }, { passive: false }));

  const card = $('#tcard');
  card.innerHTML = `<h3>${esc(t(s.t))}</h3><p>${esc(t(S().confirm && s.bc ? s.bc : (g && g.d === 'pilgrim' && s.bp) ? s.bp : s.b))}</p>${s.demo ? DEMOS[s.demo] : ''}
    <div class="tfoot"><span class="stepn">${esc(t('stepOf', { a: tourIdx + 1, b: tourSteps.length }))}</span>
    <button class="btn ghost" id="tSkip">${esc(t('tourSkip'))}</button>
    ${tourIdx ? `<button class="btn" id="tBack">${esc(t('tourBack'))}</button>` : ''}
    <button class="btn primary" id="tNext">${esc(last ? t('tourDone') : t('tourNext'))}</button></div>`;
  card.setAttribute('aria-label', t(s.t));
  // place the card where there is most room: below, above, or beside
  const vw = innerWidth, vh = innerHeight, cw = Math.min(330, vw - 24);
  card.style.width = cw + 'px';
  const ch = card.offsetHeight;
  const space = { below: vh - r.bottom, above: r.top, right: vw - r.right, left: r.left };
  let x, y;
  if (space.below >= ch + 16 && space.below >= space.above) { y = r.bottom + 12; x = r.left + r.width / 2 - cw / 2; }
  else if (space.above >= ch + 16) { y = r.top - ch - 12; x = r.left + r.width / 2 - cw / 2; }
  else if (space.right >= cw + 16) { x = r.right + 12; y = r.top + r.height / 2 - ch / 2; }
  else if (space.left >= cw + 16) { x = r.left - cw - 12; y = r.top + r.height / 2 - ch / 2; }
  else { x = (vw - cw) / 2; y = Math.max(12, (vh - ch) / 2); }
  card.style.left = clamp(x, 12, vw - cw - 12) + 'px'; card.style.top = clamp(y, 12, Math.max(12, vh - ch - 12)) + 'px';
  $('#tSkip').onclick = endTour;
  $('#tNext').onclick = () => { if (last) endTour(); else { tourIdx++; renderTourStep(); } };
  if ($('#tBack')) $('#tBack').onclick = () => { tourIdx--; renderTourStep(); };
  try { $('#tNext').focus({ preventScroll: true }); } catch (e) {}
}
addEventListener('resize', () => { if (!$('#tour').hidden) renderTourStep(); });

/* ---------------- test hooks (read-only views + scripted input) ---------------- */
window.__soulward = {
  state: () => g && { running: g.running, paused: g.paused, countdown: g.countdown, diff: g.d,
    words: g.words.map(w => ({ text: w.text, d: +w.d.toFixed(3), hint: w.hint, lost: w.lost, fused: w.fused, landed: w.landed })),
    wall: g.wall.map(l => ({ bricks: l.bricks.map(b => b.word), sealed: l.sealed })), bricks: wallBricks(), cracks: g.cracks, breaks: g.breaks,
    hearts: g.hearts, maxHearts: g.D.maxHearts, streak: g.streak, tokens: g.tokens, locked: g.locked, score: g.score, wave: g.wave, waveCount: g.waveCount,
    boss: g.boss && { name: g.boss.name, idx: g.boss.idx, words: g.boss.words, open: bossOpen(), phase: g.boss.phase, state: g.boss.state, attack: g.boss.cur && g.boss.cur.type }, buffer: g.buffer, target: g.target, typos: g.typos },
  screen: () => current, save: () => JSON.parse(JSON.stringify(save)),
  key: k => handleKey(k),
  type: s => [...s].forEach(handleKey),
  typeFirst: () => { const low = g.words.slice().sort((a, b) => b.d - a.d)[0]; const w = low ? low.text : (bossOpen() ? bossWord() : null); if (w) [...w].forEach(handleKey); return w; },
  fightBoss: () => { // one sensible move in a boss fight: strike if open and clear, else clear the lowest attack word, else wait
    if (!g.boss) return 'none';
    if (bossOpen() && !g.words.length) { [...bossWord()].forEach(handleKey); return 'strike'; }
    const low = g.words.slice().sort((a, b) => b.d - a.d)[0];
    if (low) { [...low.text].forEach(handleKey); return 'clear'; }
    for (let i = 0; i < 20 && g.running && !g.paused; i++) step(16); return 'wait';
  },
  setWave: n => { g.waveCount = n; renderHUD(); },
  setLocked: n => { g.locked = n; },
  advance: ms => { for (let i = 0; i < ms / 16; i++) { if (!g.running || g.paused) break; step(16); } },
  spawnWord: (text, fused) => spawn(text, { fused: !!fused }),
  clearWords: () => { g.words.slice().forEach(removeWord); },
  hold: on => { g.hold = !!on; },
  setHearts: n => { g.hearts = n; renderHUD(); },
  bossAt: n => { g.wave = n; g.waveCount = 15; },
  phoneType: (str, type = 'insertText') => { const el = $('#kbInput'); const ev = new InputEvent('beforeinput', { inputType: type, data: type.startsWith('delete') ? null : str, cancelable: true, bubbles: true }); el.dispatchEvent(ev); return ev.defaultPrevented; },
  kbWaiting: () => kbWaiting(),
  storageOK: () => storageOK
};

/* ---------------- boot ---------------- */
(async function boot() {
  const t0 = performance.now();
  const sp = $('#splash');
  const splashTimer = setTimeout(() => { sp.hidden = false; }, 1000); // only slow devices see it
  const stage1 = p => { $('#splashText').textContent = t('splashWords'); $('#splashBar').style.width = (p * 70) + '%'; };
  applyMotion(); applyI18n();
  await buildIndex(stage1);
  $('#splashText').textContent = t('splashFlame'); $('#splashBar').style.width = '85%';
  try { if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
  // lay the play screen out once, off-screen, so the first Play is instant
  buildKeys(); newGame(null); g.running = false; renderHUD(); measure(); g = null;
  $('#splashBar').style.width = '100%';
  clearTimeout(splashTimer); sp.hidden = true;
  show('home');
  if (!storageOK) { warnedStorage = true; toast(t('noSave')); }
  window.__soulward.bootMs = Math.round(performance.now() - t0);
})();
})();
</script>
